<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tysk med Michel Thomas-metoden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1A1A18;
    --surface: #222220;
    --paper: #F0EBE1;
    --sand: #C4A882;
    --green: #6B8F71;
    --muted: #5A5A55;
    --text: #E8E3D8;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 2rem 1.25rem 4rem;
  }

  header {
    text-align: center;
    margin-bottom: 3rem;
    padding-top: 1rem;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 400;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    color: var(--paper);
    letter-spacing: 0.01em;
  }

  header p {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 0.4rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* Progress bar */
  .progress-track {
    width: 100%;
    max-width: 480px;
    height: 2px;
    background: var(--surface);
    margin-bottom: 2rem;
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--sand);
    transition: width 0.6s ease;
  }

  /* Card */
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border: 1px solid #2E2E2B;
    border-radius: 12px;
    padding: 2rem 1.75rem;
    position: relative;
  }

  /* Tape reel signature element */
  .reel {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }

  .reel-dots {
    display: flex;
    gap: 3px;
    align-items: center;
  }

  .reel-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--sand);
    opacity: 0.3;
  }

  .reel-dot.active {
    opacity: 1;
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.6; }
  }

  .reel-label {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* Layer badge */
  .layer-badge {
    font-size: 0.7rem;
    color: var(--sand);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  /* Prompt */
  .prompt-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.1rem, 3vw, 1.35rem);
    color: var(--paper);
    line-height: 1.55;
    margin-bottom: 0.75rem;
  }

  .hint-text {
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 1.75rem;
    font-style: italic;
  }

  /* Think zone */
  .think-zone {
    background: var(--bg);
    border: 1px dashed #333330;
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .think-zone p {
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  /* Reveal area */
  .reveal-area {
    display: none;
    margin-bottom: 1.5rem;
  }

  .reveal-area.visible {
    display: block;
  }

  .answer-box {
    background: #1E2820;
    border: 1px solid #2D3F30;
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }

  .answer-german {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    color: #A8D4AE;
    margin-bottom: 0.3rem;
  }

  .answer-danish {
    font-size: 0.82rem;
    color: var(--muted);
  }

  .explanation {
    font-size: 0.82rem;
    color: var(--text);
    line-height: 1.65;
    opacity: 0.75;
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 0.75rem;
  }

  .btn {
    flex: 1;
    padding: 0.75rem 1rem;
    border: none;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }

  .btn:active { transform: scale(0.97); }

  .btn-reveal {
    background: var(--sand);
    color: var(--bg);
    width: 100%;
  }

  .btn-got-it {
    background: var(--green);
    color: #fff;
  }

  .btn-again {
    background: var(--surface);
    color: var(--text);
    border: 1px solid #333;
  }

  .btn:hover { opacity: 0.88; }

  /* Loading */
  .loading {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid #333;
    border-top-color: var(--sand);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 0.75rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Score */
  .score-bar {
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1.5rem;
    padding: 0 0.25rem;
  }

  .score-bar span {
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .score-count {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: var(--sand);
  }

  /* Session complete */
  .complete {
    text-align: center;
    padding: 2rem 1rem;
  }

  .complete h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: var(--paper);
    margin-bottom: 0.75rem;
  }

  .complete p {
    color: var(--muted);
    font-size: 0.85rem;
    line-height: 1.6;
    margin-bottom: 1.5rem;
  }

  /* Error */
  .error-msg {
    font-size: 0.8rem;
    color: #c0826a;
    margin-top: 0.5rem;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>Deutsch — Michel Thomas</h1>
  <p>Byg sproget lag for lag</p>
</header>

<div class="progress-track">
  <div class="progress-fill" id="progressFill" style="width: 0%"></div>
</div>

<div class="card" id="mainCard">
  <div class="loading" id="loadingState">
    <div class="spinner"></div>
    Henter første øvelse…
  </div>
</div>

<div class="score-bar">
  <span>Forstået</span>
  <span class="score-count" id="scoreDisplay">0</span>
  <span>Øvelser</span>
</div>

<script>
const LEVELS = [
  { id: 1, label: "Lag 1 — Genkendelige ord", desc: "Mange tyske ord ligner engelske eller danske" },
  { id: 2, label: "Lag 2 — Grundsætninger", desc: "Subjekt + verbum + objekt" },
  { id: 3, label: "Lag 3 — Modal verber", desc: "können, wollen, müssen" },
  { id: 4, label: "Lag 4 — Tid og sted", desc: "Præpositioner og tidsudtryk" },
  { id: 5, label: "Lag 5 — Sammensatte sætninger", desc: "Fordi, når, hvis" },
];

let sessionExercises = [];
let currentIndex = 0;
let score = 0;
let revealed = false;
let currentLevel = 1;
let levelExerciseCount = 0;

async function fetchExercise(level) {
  const levelInfo = LEVELS[level - 1];
  const prompt = `Du er Michel Thomas – en rolig, tålmodig tysklærer der underviser en dansk elev.

Regler:
- Giv ÉN øvelse på niveau "${levelInfo.label}": ${levelInfo.desc}
- Øvelsen skal bygge på noget eleven allerede kender fra tidligere lag (${level > 1 ? LEVELS.slice(0, level-1).map(l => l.label).join(', ') : 'ingen endnu'})
- Prompt: En dansk sætning eleven skal oversætte til tysk
- Svar KUN i dette JSON-format (ingen markdown, ingen forklaring udenfor JSON):
{
  "danish": "Den danske sætning",
  "german": "Den tyske oversættelse",
  "hint": "En kort hjælp på dansk – fx grammatisk mønster eller ordsammenligning",
  "explanation": "En rolig forklaring på dansk (1-2 sætninger) om hvorfor det hedder sådan"
}

Vælg en sætning der er relevant for en dansker på ferie i Harzen i Tyskland.`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }]
    })
  });

  const data = await response.json();
  const text = data.content.map(b => b.text || "").join("").replace(/```json|```/g, "").trim();
  return JSON.parse(text);
}

function renderCard(exercise, level) {
  revealed = false;
  const levelInfo = LEVELS[level - 1];
  const card = document.getElementById('mainCard');

  card.innerHTML = `
    <div class="reel">
      <div class="reel-dots">
        <div class="reel-dot active"></div>
        <div class="reel-dot"></div>
        <div class="reel-dot"></div>
      </div>
      <span class="reel-label">Optager</span>
    </div>

    <div class="layer-badge">${levelInfo.label}</div>

    <p class="prompt-text">${exercise.danish}</p>
    <p class="hint-text">${exercise.hint}</p>

    <div class="think-zone">
      <p>Tænk over det… tryk så på Vis svar</p>
    </div>

    <div class="reveal-area" id="revealArea">
      <div class="answer-box">
        <div class="answer-german">${exercise.german}</div>
        <div class="answer-danish">${exercise.danish}</div>
      </div>
      <p class="explanation">${exercise.explanation}</p>
    </div>

    <div id="btnArea">
      <button class="btn btn-reveal" onclick="revealAnswer()">Vis svar</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  `;
}

function revealAnswer() {
  revealed = true;
  document.getElementById('revealArea').classList.add('visible');
  document.getElementById('btnArea').innerHTML = `
    <div class="btn-row">
      <button class="btn btn-again" onclick="markAgain()">Igen</button>
      <button class="btn btn-got-it" onclick="markGotIt()">Forstået ✓</button>
    </div>
  `;
}

async function markGotIt() {
  score++;
  document.getElementById('scoreDisplay').textContent = score;
  levelExerciseCount++;
  await nextExercise();
}

async function markAgain() {
  // Re-fetch same level
  await nextExercise(true);
}

async function nextExercise(sameLevel = false) {
  // Advance level every 3 exercises, max level 5
  if (!sameLevel && levelExerciseCount >= 3 && currentLevel < 5) {
    currentLevel++;
    levelExerciseCount = 0;
  }

  const total = currentLevel * 3;
  const done = (currentLevel - 1) * 3 + levelExerciseCount;
  const pct = Math.min(100, Math.round((done / 15) * 100));
  document.getElementById('progressFill').style.width = pct + '%';

  if (score >= 10) {
    showComplete();
    return;
  }

  showLoading();
  try {
    const ex = await fetchExercise(currentLevel);
    renderCard(ex, currentLevel);
  } catch (e) {
    document.getElementById('mainCard').innerHTML = `
      <p style="color:#c0826a;text-align:center;padding:2rem;font-size:0.85rem;">
        Kunne ikke hente øvelse. Tjek din forbindelse og prøv igen.
      </p>
      <button class="btn btn-reveal" onclick="location.reload()" style="margin-top:1rem">Genstart</button>
    `;
  }
}

function showLoading() {
  document.getElementById('mainCard').innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      Forbereder næste øvelse…
    </div>
  `;
}

function showComplete() {
  document.getElementById('mainCard').innerHTML = `
    <div class="complete">
      <h2>Godt arbejde.</h2>
      <p>Du har forstået ${score} øvelser i denne session.<br>
      Michel Thomas ville sige: du har ikke lært det — du ved det.</p>
      <button class="btn btn-reveal" onclick="restartSession()">Ny session</button>
    </div>
  `;
  document.getElementById('progressFill').style.width = '100%';
}

function restartSession() {
  score = 0;
  currentLevel = 1;
  levelExerciseCount = 0;
  document.getElementById('scoreDisplay').textContent = '0';
  document.getElementById('progressFill').style.width = '0%';
  nextExercise();
}

// Start
nextExercise();
</script>
</body>
</html>
